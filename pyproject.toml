[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitex"
description = "Fast-forward Git flow branches and report potential merge conflicts."
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.16",
]

[project.scripts]
gitex = "gitex.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
"Homepage" = "https://wnowicki.dev"
"Source" = "https://github.com/wnowicki/gitex"

[tool.ruff]

line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# 1. Enable flake8-bugbear (`B`) rules, in addition to the defaults.
select = [
    "E", # All errors
    "F", # PyFlakes
    "B", # Bugbear
    "Q", # Quoting
    "I", # Isort
    "S", # flake8-bandit
    "N", # pep8-naming
    "A", # flake8-builtins
    "FAST", # FastAPI specific rules
    "C4", # flake8-comprehensions
    # "FIX", # Fixme
    "LOG", # flake8-logging
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "C90", # mcCabe complexity
]

# 2. Avoid enforcing line-length violations (`E501`)
ignore = ["E501"]

# 3. Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# 4. Ignore `E402` (import violations) in all `__init__.py` files, and in selected subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F403"]
"**/{tests,docs,tools,scripts}/*" = ["E402", "S"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]
